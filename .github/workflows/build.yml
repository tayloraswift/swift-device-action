on:
    workflow_call:
        inputs:
            xcode-scheme:
                description: 'The Xcode scheme to build'
                required: true
                type: string

            xcode-version:
                description: 'The Xcode version to use'
                required: false
                type: string
                default: 'Xcode_26.4'

            destination:
                description: 'The destination platform'
                required: true
                type: string

            badge-namespace:
                description: 'If true, publish status badge to /refs/badges/ci'
                required: false
                type: string

jobs:
    build:
        runs-on: macos-26
        steps:
            -   name: 💖 Checkout repository 💖
                uses: actions/checkout@v6

            -   name: 💖 Select Xcode 💖
                run: sudo xcode-select -s /Applications/${{ inputs.xcode-version }}.app/Contents/Developer

            -   name: 💖 Build 💖
                run: |
                    swift --version
                    xcrun xcodebuild build -list
                    xcrun xcodebuild build \
                        -scheme "${{ inputs.xcode-scheme }}" \
                        -destination "generic/platform=${{ inputs.destination }}"

            -   name: 💖 Update badge 💖
                uses: rarestype/rarestbadge@v1
                if: always() && inputs.badge-namespace
                with:
                    badge: ${{ inputs.badge-namespace }}/${{ inputs.destination }}
                    title: ${{ inputs.destination }}

